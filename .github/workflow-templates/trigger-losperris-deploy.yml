# Copia a cada repo de API: .github/workflows/trigger-losperris.yml
#
# Secrets en ESE repo:
#   LOS_PERRIS_DISPATCH_TOKEN — PAT clásico con scope "repo" (acceso a Ponss17/LosPerris)
#
# Secret en LosPerris (repo principal):
#   UPDATE_SYNC_TOKEN — PAT clásico con scope "repo" (lee Valorant, QR, transcripts privados)
#
# --- Qué commits aparecen en /actualizaciones ---
# SÍ:  feat:, fix:, perf:, a11y:, infra:, refactor:  o  [update] / [novedad] en el mensaje
# SÍ:  mensajes descriptivos (Mejorar…, Corregir…, Migrar…) con texto sustancial
# NO:  merge, chore, lint, deps, wip, typos, sync de caché, etc.
# Forzar omitir:  [skip update] en el mensaje del commit

name: Avisar a LosPerris (novedades)

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sync en LosPerris
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LOS_PERRIS_DISPATCH_TOKEN" \
            https://api.github.com/repos/Ponss17/LosPerris/dispatches \
            -d '{"event_type":"sync-updates"}'
        env:
          LOS_PERRIS_DISPATCH_TOKEN: ${{ secrets.LOS_PERRIS_DISPATCH_TOKEN }}
