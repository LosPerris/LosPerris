name: Sincronizar actualizaciones desde repos privados

concurrency:
  group: sync-updates
  cancel-in-progress: false

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-updates]
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar y guardar published.json
        env:
          # PAT opcional. No sobrescribir GITHUB_TOKEN: Actions lo necesita para git
          # y puede leer otros repos si Settings → Actions → Access lo permite.
          UPDATE_SYNC_TOKEN: ${{ secrets.UPDATE_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node scripts/updates/sync.mjs
            git add src/data/updates/published.json
            if git diff --staged --quiet; then
              echo "Sin cambios en published.json"
              exit 0
            fi
            git commit -m "chore: sincronizar actualizaciones desde commits de APIs"
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt), reintentando..."
            sleep $((attempt * 2))
          done
          echo "No se pudo pushear tras 3 intentos"
          exit 1

      - name: Notificar fallo en Discord
        if: failure()
        env:
          UPDATES_ALERT_WEBHOOK: ${{ secrets.UPDATES_ALERT_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/updates/notify-failure.mjs "Falló el workflow de sync de actualizaciones en ${{ github.repository }}."
